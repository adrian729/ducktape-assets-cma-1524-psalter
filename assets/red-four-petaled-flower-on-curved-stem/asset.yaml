id: red-four-petaled-flower-on-curved-stem
title: Red four-petalled flower on a curved stem
description: A large red flower seen from the front at the right, with four broad notched petals edged in dark red, each with gold striping, around a pale pink centre. From the left a long green stem curves in, carrying two broad leaves that curl up at the left and down at the lower right, pale green on one side of the midrib and dark on the other, with cream hatching and a black outline. Opaque gouache with a thin gold-ground fringe; the background is transparent.
