id: gray-metal-water-jug-with-small-foot
title: Gray metal jug
description: A small blue-gray metal jug seen from the front, with a round belly with a dotted band and a dark arc, a short cylindrical neck topped by a flat round rim with a spiral, a small loop handle at the left and a short spout at the right, standing on a flat base with a sliver of the blue-gray puddle it sits in. Black outlines, soft edges. Cut from the bas-de-page scene of the recto, where it stands in front of the bathtub; the background is transparent.
