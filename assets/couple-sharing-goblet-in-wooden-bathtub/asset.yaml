id: couple-sharing-goblet-in-wooden-bathtub
title: Couple sharing a goblet in a bathtub
description: A woman in a white head-cloth and gold necklace at the left and a man with curly golden hair at the right sit facing each other, nude to the waist, in a round brown wooden tub bound with gold hoops; between them they hold a dark blue-gray goblet. The tub's staves rise higher behind them and the water inside is pale blue. Cut from the bas-de-page scene of the recto; the background is transparent.
