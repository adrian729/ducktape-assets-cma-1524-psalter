title: Broad red flower with a blue and gray crown
description: A wide red flower seen from the front, a scalloped red cup with white and gold striping, topped by four round blue petals and a gray pointed petal curling up from the centre, above a fan of about nine finger-like red lobes with gold striping that spread out and curl at the tips. No stem or leaves; dark outlines. The background is transparent.
