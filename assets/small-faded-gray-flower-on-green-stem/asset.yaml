id: small-faded-gray-flower-on-green-stem
title: Faded brown flower with a yellow upper petal
description: A worn flower with three dusty pinkish-brown petals and one yellow-ochre petal bent upward sits at the top of a slender green stem; the paint of the petals is abraded. A green leaf with pale vein strokes grows to the right at mid height and a second leaf hangs to the lower left at the foot. Tall narrow piece on a transparent background.
