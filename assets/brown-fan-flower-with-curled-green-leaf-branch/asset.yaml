id: brown-fan-flower-with-curled-green-leaf-branch
title: Brown fan flower with strawberry on a leafy stem
description: A brown fan-shaped flower with fluted petals and a green calyx sits at the top of a long green stem. Three large green leaves with dark outlines and pale vein strokes grow from the stem, two rising on either side and one hanging to the right. At the foot the stem curls into a loop that ends in a green bud cluster and a small red strawberry-like fruit with crosshatched seeds. Tall piece on a transparent background.
