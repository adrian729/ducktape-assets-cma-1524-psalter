# descriptive: find it and understand it
id: crossed-horizontal-green-leaf-pair
title: Crossed pair of horizontal leaves
description: Two long pointed green leaves lie left and right, joined at the middle where their short stems cross and curl outward up and down. Each leaf is two-toned, teal green with cream hatching on one side of the midrib and dark green with a black band on the other, with a black outline. Opaque gouache; the background is transparent.
