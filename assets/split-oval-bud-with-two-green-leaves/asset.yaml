id: split-oval-bud-with-two-green-leaves
title: Split oval bud with red interior on a tall stem
description: An oval pinkish-brown bud with a small knob at the top sits at the head of a long green stem; its front is split open to show a red interior dotted with cream. Two green leaves with gold-edged margins cross the lower stem, one rising to the left and one hanging to the right. Transparent background.
