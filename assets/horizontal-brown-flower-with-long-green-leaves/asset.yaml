title: Brown fan flower on a long horizontal stem
description: A very long, thin horizontal sprig. At the left end a small brown fan-shaped flower with a green calyx points left; from it a thin green stem runs the full width to the right, with two long, narrow, undulating green leaves lying along it, one lighter and one darker. Transparent background.
