# descriptive: find it and understand it
id: red-gray-radial-flower-on-green-leaf-spray
title: Red bowl flower with gray inner petals on a leaf spray
description: At the top a red bowl-shaped flower with cream striping, a gray-blue folded inner petal and a brown curling bract behind it, sits on a green and cream collar. Below, a thin stem runs down with three large green leaves, pale-veined with black outlines, and a small gray-tipped green bud on a side shoot at the right. Opaque gouache with a gold-ground fringe; the brown bract at the top left and the leaf at the right are clipped by the page edge. The background is transparent.
