id: red-scalloped-flower-on-long-green-leaves
title: Red carnation with two long leaves
description: A red carnation with five fringed, scalloped petals marked by pale radiating lines fills the right half, seen from the front. Its green stem curves down to the left and carries two long, narrow green leaves with pale vein strokes, one rising up and one lying along the bottom, meeting at a short stalk at the lower left. Wide horizontal piece on a transparent background.
