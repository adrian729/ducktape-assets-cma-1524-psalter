id: pale-yellow-daisy-on-leafy-stem
title: Yellow daisy with red centre on a leafy stem
description: A pale yellow daisy with many rounded petals and a red centre dotted with yellow is seen from the front at the left. Its green stem runs to the right and ends in a curl, carrying three lobed, serrated green leaves with pale vein strokes, two above the stem and one below. Wide horizontal piece on a transparent background.
