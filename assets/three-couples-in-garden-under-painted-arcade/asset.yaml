# descriptive: find it and understand it
id: three-couples-in-garden-under-painted-arcade
title: Three couples in a garden under an arcade
description: The bas-de-page scene of the recto, a wide strip under three painted arches (red, blue, red) on blue and red columns with gold capitals. At the left a seated couple in blue and red embrace; in the middle a couple sits in a wooden tub sharing a goblet, a gray jug on the ground before it; at the right a nude couple embraces, one fist raised. Behind them green trees, a blue sky and pale buildings at the right, on a sandy ground with pebbles and grass. Opaque, with a thin red-brown rule along the top and bottom; transparent outside.
