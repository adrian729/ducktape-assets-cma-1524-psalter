id: rose-blue-and-gold-layered-flower
title: Layered rose, blue and brown flower
description: A wide fantastical flower built in layers, a rose-pink striped base petal, two deep blue petals scrolling outward into spirals at either side, a tall brown and gold folded petal in the centre and two spiky red and gold petals flanking it. Three rounded pale green sepals sit below, and a short dark stem carries two pointed green leaves, pale-veined, spreading left and right. Opaque gouache with a thin gold-ground fringe; the background is transparent.
