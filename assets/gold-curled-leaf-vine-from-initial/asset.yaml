id: gold-curled-leaf-vine-from-initial
title: Gold curling vine from an initial
description: "A gold foliate vine taken from inside a decorated initial: a central stem rises and splits into curling tendrils ending in spirals, with a trefoil of round leaves at the top, a small spiral at the left and a hooked leaf at the right. The gold is textured and flecked with brown where it has worn; the letter is not included. Transparent background."
