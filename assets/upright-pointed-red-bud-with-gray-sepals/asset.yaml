id: upright-pointed-red-bud-with-gray-sepals
title: Pointed red bud in a gray cup
description: A pointed red bud with gold streaks rises from a cup of three gray-blue sepals with pale highlights, set on three rounded pale green bracts. A straight green stem runs down with two rounded green leaves spreading left and right at mid height, teal with cream hatching on one side of the midrib and dark green with a black outline on the other. Opaque gouache; the background is transparent.
