title: Round purplish-brown bud on a straight leafy stem
description: A round purplish-brown bud or seed head with pale yellow-green rings and a small knob at the top sits on a long, straight green stem. Two green leaves with pale vein strokes grow out at mid height, one to each side, and a third leaf hangs to the lower left near the foot. Tall narrow piece on a transparent background.
