# descriptive: find it and understand it
id: crossed-upright-green-leaf-pair
title: Crossed pair of upright leaves, recto
description: Two long pointed green leaves, one rising and one hanging, joined at the middle where their two short stems cross and curl outward to the left and right. Each leaf is two-toned, pale green on one side of the midrib and dark green on the other, with cream hatching and a black outline. Opaque gouache with a thin gold-ground fringe; the background is transparent.
