id: upright-crossed-green-leaf-pair
title: Crossed pair of upright leaves, verso
description: Two long pointed green leaves, one rising and one hanging, joined at the middle where their short stems cross and curl outward to the left and right. Each leaf is two-toned, teal green with cream hatching on one side of the midrib and dark green with a black band on the other, with a black outline. Opaque gouache; the background is transparent.
