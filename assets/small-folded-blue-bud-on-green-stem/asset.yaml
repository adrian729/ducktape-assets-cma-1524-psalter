id: small-folded-blue-bud-on-green-stem
title: Blue bud with brown bracts on a long stem
description: A round deep blue bud with pale stripes and dots and a small curled tip at the right, held between two rounded brown bracts with cream rims above and below, at the right end of a long thin green stem that runs straight to the left with a pale highlight along its length. Opaque gouache with a thin gold-ground fringe; the background is transparent.
