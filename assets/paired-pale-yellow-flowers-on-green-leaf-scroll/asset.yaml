id: paired-pale-yellow-flowers-on-green-leaf-scroll
title: Two pale yellow flowers on a leafy branch
description: Two pale yellow five-petalled flowers with orange centres, seen from the front, sit at the left on thin green stems, one above the other. The stems join a branch at the right that carries two large curling green leaves, one sweeping up and one down, teal with cream hatching on one side and dark green on the other, with dark outlines. Opaque gouache; the background is transparent.
