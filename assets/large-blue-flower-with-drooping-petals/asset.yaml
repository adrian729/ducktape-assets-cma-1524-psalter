id: large-blue-flower-with-drooping-petals
title: Large blue flower with drooping petals on a tall stem
description: A large deep blue flower stands upright at the top; three rounded petals with gold anthers rise at the back, and the outer petals fold over and droop down on either side, with pale blue highlights and black outlines. It sits on a green calyx above a long straight stem, from whose foot two long narrow green leaves sweep upward on either side, teal and dark green with cream hatching. Opaque gouache; the background is transparent.
