title: Blue and rose flower on an upright stem
description: An upright flower whose pointed blue outer petal rises to the upper left over three dusky rose inner petals, set in a scalloped green calyx. The straight green stem below carries two green leaves with yellow veins and gold flecks along its length. Transparent background.
