id: hanging-red-bud-on-long-horizontal-stem
title: Red bud pointing right on a long stem
description: A red bud with gold and white striping points to the right, held in a rounded green calyx with pale striping and two small green bracts. A long green stem runs straight to the left from the bud and carries two rounded green leaves near its left end, one above and one below, pale-veined with black outlines. Opaque gouache; the background is transparent.
