id: gold-curled-leaf-vine-from-round-initial
title: Gold curling vine from a round initial
description: "A gold foliate vine taken from inside a round decorated initial: a central stem rises to three curled buds, two spiral tendrils curl at the lower left, and a long stroke with a hooked tip runs up the right side. The gold is speckled and gappy where it has flaked; the letter is not included. Transparent background."
