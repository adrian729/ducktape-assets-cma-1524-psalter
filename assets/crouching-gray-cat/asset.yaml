# descriptive: find it and understand it
id: crouching-gray-cat
title: Gray cat crouching with a mouse
description: A dark gray cat crouches low on a patch of green grass, its body stretched to the right and its head turned toward the viewer with round gold eyes and pricked ears; its long, faintly banded tail curls back along the left. A dark mouse hangs from its mouth, the thin black tail trailing on the grass. The fur is painted in fine pale strokes; the grass patch is streaked green with gold speckling and is cut flat along the bottom. The background is transparent.
