# descriptive: find it and understand it
id: elongated-red-gray-leaf-scroll-with-blue-center
title: Thin red and grey leaf spindle with blue bud
description: A very long, thin horizontal ornament. At the centre a round blue bud is held between two petal collars, red on the left and grey on the right. From the collars two tapering leaves stretch outward to a point, a grey one to the left and a red one to the right, each with a fine gold edge line and a curled tip. Transparent background.
