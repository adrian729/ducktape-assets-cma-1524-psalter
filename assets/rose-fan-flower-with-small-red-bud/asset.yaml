# descriptive: find it and understand it
id: rose-fan-flower-with-small-red-bud
title: Crimson fan flower on a long budding stem
description: A crimson fan-shaped flower with fine striping opens at the top, held in small green sepals. A long green stem descends and branches, carrying four pairs of rounded green leaves with pale veins, a small red bud with a blue petal on a side shoot at the right about a third of the way down, and a blue and rose bud hanging at the very bottom. Opaque gouache; the thin stems have small gaps and a gold-ground fringe. The background is transparent.
