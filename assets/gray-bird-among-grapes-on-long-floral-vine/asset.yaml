# descriptive: find it and understand it
id: gray-bird-among-grapes-on-long-floral-vine
title: Grapevine border with crane pecking at grapes
description: Complete vertical border of the recto. A grapevine fills the upper half with lobed green leaves, curling tendrils and four bunches of green grapes. Below it a grey long-necked bird with raised wings stands on a vine stem and reaches up to peck at the lowest bunch. Under the bird a large blue six-pointed flower, and at the foot a cluster of red, grey and blue acanthus leaves with gold edges. Transparent background.
