title: Gold leaf scroll fragment from an initial
description: "A small gold foliate scroll taken from inside a decorated initial: a C-shaped curl at the left joins a lobed leaf at the right. The gold is speckled with gaps where it has flaked, and the ends are cut where they met the letter, which is not included. Transparent background."
