# descriptive: find it and understand it
id: acanthus-scroll-with-vase-and-satyr
title: Acanthus scroll border with vase and horn-blowing satyr
description: Complete lower border of the recto. A grey acanthus scroll with gold-edged leaves runs the full width, curling at the left into a spiral that holds a red five-petalled flower. At the centre a copper-orange vase with a blue mouth sits on green acanthus leaves, with red and blue leaf tips on either side. At the right end a horned, bearded, goat-legged satyr with a brown body sits facing left and blows a long curved blue horn with red dots along its rim. Transparent background.
