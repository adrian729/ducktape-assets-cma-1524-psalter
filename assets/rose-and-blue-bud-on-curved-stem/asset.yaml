id: rose-and-blue-bud-on-curved-stem
title: Rose bud with a blue tip on a curved stem
description: A rounded rose-pink bud with a small deep blue pointed petal at its upper left sits in two green sepals at the top. A green stem curves down to the right and back, carrying two pairs of rounded green leaves, pale green with cream hatching on one side of the midrib and dark green with a black outline on the other. Opaque gouache with a thin gold-ground fringe; the background is transparent.
