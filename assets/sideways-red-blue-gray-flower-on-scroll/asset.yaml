id: sideways-red-blue-gray-flower-on-scroll
title: Sideways red, blue and gray flower with two leaves
description: A flower lying on its side points to the lower right, with a red striped lobe at the tip, a gray curling petal above it and three small round blue petals at its base. From the upper left a green stem runs down to it, carrying two large green leaves that curl up and down, teal with cream hatching on one side of the midrib and dark green on the other, with dark outlines. Opaque gouache; the background is transparent.
