id: blue-folded-flower-on-tall-green-stem
title: Blue folded flower on a tall stem
description: A deep blue flower with three folded, pale-striped petals and a long lower petal that curls down to the left, rising from a small green calyx of rounded sepals. A tall, slender green stem runs straight down with one pointed leaf on the right at mid height and one on the left near the foot, both with pale veins and dark outlines. Opaque gouache with a thin gold-ground fringe at the edges; the background is transparent.
