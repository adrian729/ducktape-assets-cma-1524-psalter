title: Two crossed green leaves on a short twig
description: Two long green leaves with dark outlines and pale vein strokes cross at a short stem; the upper one rises to the right, the lower one hangs down to the left with a curled, lobed tip. A short twig sticks out to the left at the crossing. Tall narrow piece on a transparent background.
