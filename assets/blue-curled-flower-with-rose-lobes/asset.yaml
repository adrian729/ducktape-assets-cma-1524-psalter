id: blue-curled-flower-with-rose-lobes
title: Blue curled flower with red lobes
description: A large blue flower at the upper left, its striped petals curling inward and one petal spiralling down to the left, with a brown and pale blue bract behind it, sits on a cluster of four rounded red lobes with cream striping. From the lower right a green stem carries two broad green leaves with pale veins and dark outlines, one pointing up and one down-left. Opaque gouache with a thin gold-ground fringe at the edges; the background is transparent.
