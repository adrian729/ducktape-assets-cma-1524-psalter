id: middle-two-green-leaf-curved-twig
title: Two crossed green leaves on a short twig
description: Two long green leaves with gold-edged margins and pale vein strokes cross at a short stem, the upper one pointing up to the right and the lower one hanging down to the left with a curled tip. A short twig with a gold tip sticks out to the left at the crossing. Transparent background.
