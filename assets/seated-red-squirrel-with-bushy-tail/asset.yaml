id: seated-red-squirrel-with-bushy-tail
title: Red squirrel sitting on a patch of grass
description: A reddish-brown squirrel sits upright on a small patch of green grass, seen from the side and facing right, with both forepaws raised in front of its chest. Its large bushy tail curls up behind the back to above the head, and the ears stand up with pale tufts. The fur is modelled in fine dark strokes with white highlights. Transparent background.
