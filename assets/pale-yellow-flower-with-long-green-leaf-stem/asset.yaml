title: Yellow five-petalled flower with looping stem
description: A yellow flower with five broad petals outlined in orange and a green knobbed centre sits at the top left. Its green stem loops up over the flower and runs down to the right, carrying three tiers of paired green leaves with dark outlines and pale vein strokes. Tall piece on a transparent background.
