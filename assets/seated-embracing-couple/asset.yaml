title: Seated embracing couple
description: A woman in a blue gown with gold edging and a red hat sits on the ground at the left, seen from behind in three-quarter view, and embraces a man with golden hair in a red doublet with gold trim, green and blue striped hose and black shoes, who sits close behind her with his legs stretched to the right; their faces touch. Cut from the bas-de-page scene of the recto; the background is transparent.
