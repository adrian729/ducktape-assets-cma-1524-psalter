# descriptive: find it and understand it
id: gold-hatched-fruit-on-green-leafy-stem
title: Gold cross-hatched fruit on a leafy stem
description: A round pale gold fruit, cross-hatched in a diamond pattern and splitting open in a dark red slit at its lower right, hangs below three rounded pale green sepals. Above it a thin dark stem rises with two pairs of pointed green leaves, pale-veined with black outlines. The gold paint is worn, with cream parchment showing through, and a gold-ground fringe follows the edges. The background is transparent.
