title: Peasant carrying a large wicker basket
description: A bearded man in a gray tunic with gold edging, a gray cap, blue hose and black shoes walks to the left, bent forward under a tall rectangular wicker basket strapped to his back. He leans on a brown staff in his right hand and holds a second brown rod level in his left. He walks on a patch of green grass, cut flat below. Opaque gouache with dark outlines; the background is transparent.
