title: Red umbrella-shaped flower on a tall stem
description: A red flower shaped like a bell or umbrella, with gold streaks down its skirt and a small gold tuft at the top, hangs over a green calyx of pointed sepals. A tall straight green stem runs down with two rounded green leaves, one at the right and one lower at the left, teal with cream hatching and dark green edges. Opaque gouache; the background is transparent.
