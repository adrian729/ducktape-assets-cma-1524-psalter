id: large-red-tulip-with-blue-sepals-and-side-bud
title: Red tulip-like flower with blue calyx and side bud
description: A tall red flower of pointed, finely striped petals, closed like a tulip with a small green tip, rises from a scalloped deep blue calyx with pale striping. A long green stem descends, with a smaller red bud on a side shoot to the right and two large lobed green leaves, one at the upper left and one at the lower right, teal with cream hatching and dark green edges. Opaque gouache; the background is transparent.
