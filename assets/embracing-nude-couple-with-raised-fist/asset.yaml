id: embracing-nude-couple-with-raised-fist
title: Embracing nude couple, one fist raised
description: Two nude figures with curly red-gold hair embrace standing. A man at the left, seen from behind, cups the back of the woman's head with his right hand; the woman at the right faces him, her left arm raised high with a clenched fist and her other hand on his shoulder. Pale pink flesh with brown outlines and bluish shadows; the feet rest on the ground line of the scene and are cut flat there. Cut from the bas-de-page scene of the recto; the background is transparent.
